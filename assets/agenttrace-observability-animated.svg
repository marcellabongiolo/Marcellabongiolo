<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="340" viewBox="0 0 1100 340" role="img" aria-label="Animated AgentTrace observability system architecture with telemetry flowing from Python SDK to FastAPI, SQLite and Next.js dashboard">
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#0e121a"/><stop offset="1" stop-color="#222b39"/></linearGradient><linearGradient id="line"><stop stop-color="#9eabc3"/><stop offset=".5" stop-color="#c7b6d7"/><stop offset="1" stop-color="#93d2ca"/></linearGradient><filter id="glow"><feGaussianBlur stdDeviation="5"/></filter><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" stroke="#a3b4ca" stroke-opacity=".08" fill="none"/></pattern></defs>
<rect width="1100" height="340" rx="20" fill="url(#bg)"/><rect width="1100" height="340" rx="20" fill="url(#grid)"/>
<text x="38" y="54" fill="#e7e6ed" font-family="Consolas,'Courier New',monospace" font-size="32" font-weight="bold">AGENTTRACE <tspan fill="#aeb5c7">/</tspan> OBSERVABILITY</text>
<text x="40" y="79" fill="#aab5c6" font-family="Arial,sans-serif" font-size="13" letter-spacing="2">PYTHON SDK  ·  FASTAPI  ·  SQLITE  ·  NEXT.JS</text>
<g fill="#1b2430" stroke="#8194aa" stroke-width="1.4"><rect x="35" y="128" width="210" height="112" rx="13"/><rect x="308" y="128" width="210" height="112" rx="13"/><rect x="581" y="128" width="210" height="112" rx="13"/><rect x="854" y="128" width="210" height="112" rx="13"/></g>
<g font-family="Consolas,'Courier New',monospace" text-anchor="middle"><text x="140" y="173" font-size="20" fill="#d4d6e4">Python SDK</text><text x="413" y="173" font-size="20" fill="#d4d6e4">FastAPI</text><text x="686" y="173" font-size="20" fill="#d4d6e4">SQLite</text><text x="959" y="173" font-size="20" fill="#d4d6e4">Next.js</text></g>
<g font-family="Arial,sans-serif" text-anchor="middle" font-size="13" fill="#a5b6c5"><text x="140" y="204">trace spans + events</text><text x="413" y="204">ingestion + query</text><text x="686" y="204">persistent telemetry</text><text x="959" y="204">monitoring dashboard</text></g>
<g fill="none" stroke="url(#line)" stroke-width="3"><path d="M245 184H308"/><path d="M518 184H581"/><path d="M791 184H854"/></g>
<g fill="#d3c5e3"><circle r="5"><animateMotion path="M245 184H308" dur="2.4s" repeatCount="indefinite"/></circle><circle r="5"><animateMotion path="M518 184H581" dur="2.4s" begin=".7s" repeatCount="indefinite"/></circle><circle r="5"><animateMotion path="M791 184H854" dur="2.4s" begin="1.4s" repeatCount="indefinite"/></circle></g>
<g stroke="#93d2ca" stroke-width="2" fill="none" opacity=".85"><path d="M42 282H95L109 266L125 297L145 277L158 282H210"><animate attributeName="stroke-dasharray" values="0 220;220 0;0 220" dur="5s" repeatCount="indefinite"/></path></g>
<text x="230" y="287" fill="#b8c4d2" font-family="Consolas,'Courier New',monospace" font-size="14">traces / spans / latency / errors</text>
<g font-family="Consolas,'Courier New',monospace" font-size="13"><circle cx="894" cy="281" r="6" fill="#8bd5b5"><animate attributeName="opacity" values=".35;1;.35" dur="2s" repeatCount="indefinite"/></circle><text x="909" y="286" fill="#c0d8cc">MONITORING ACTIVE</text></g>
<text x="40" y="320" font-family="Arial,sans-serif" font-size="11" fill="#8799ac">Portfolio architecture visualization · local MVP · simulated telemetry flow</text>
</svg>